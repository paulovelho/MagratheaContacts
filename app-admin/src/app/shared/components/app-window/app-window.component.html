<p-panel [toggleable]="collapsable" [collapsed]="hideContent">
	<ng-template pTemplate="header">
		<i class="fa" [ngClass]="icon"></i>
		{{ title }}
		<app-loading *ngIf="loading" extraClass="inline small"></app-loading>
	</ng-template>
	<ng-template pTemplate="icons">
		<i class="fa fa-refresh icon-action" *ngIf="showRefresh" (click)="onRefresh.emit()"></i>
	</ng-template>
	<ng-content></ng-content>
</p-panel>
