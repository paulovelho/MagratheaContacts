@if (id) {
	<p-floatlabel [variant]="floatPos" class="app-textarea">
		<p-editor
			[id]="id" [name]="id"
			[required]="required"
			[class.ng-invalid]="error"
			[(ngModel)]="value"
			[style]="{ height: height + 'px' }"
			class="form-control checking-field"
			(ngModelChange)="valueEmit();"
			[placeholder]="label"
			[disabled]="disabled"
		/>
	</p-floatlabel>
} @else {
	<span>ID not set</span>
}
