<app-source-selector />

<app-email-filter />

<app-window title="Emails" icon="envelope"
	class="window-emails"
	[loading]="loading"
	[showClose]="false"
	[showRefresh]="true"
	(onRefresh)="getMails()"
	>
	<div class="row mt-2">
		@if(emails.length > 0) {
			<app-email-list
				[list]="emails"
			/>
		}
		@if(loading) {
			<app-loading-message class="mt-4" />
		}
	</div>

</app-window>
