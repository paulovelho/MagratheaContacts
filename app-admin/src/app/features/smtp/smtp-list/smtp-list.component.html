<app-window title="SMTP List" icon="list" [loading]="loading">
	@for (smtp of smtps; track smtp["id"]) {
		<app-smtp-item
			[smtp]="smtp"
			(edit)="editSmtp($event)"
			(remove)="deleteSmtp($event)"
		></app-smtp-item>
	}
</app-window>
<app-button
	type="success"
	(action)="nav.goSmtpNew()"
	caption="New"
	icon="plus-circle"
/>
