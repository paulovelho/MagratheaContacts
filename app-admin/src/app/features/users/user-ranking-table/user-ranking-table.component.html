<p-table
	*ngIf="data.length > 0"
	[value]="data"
	selectionMode="multiple"
	dataKey="id"
	[tableStyle]="{'min-width': '50rem'}"
>
	<ng-template pTemplate="header">
		<tr>
			<th>#</th>
			<th>Nome</th>
			<th>Pontos</th>
			<th>Location</th>
			<th>Sent date</th>
			<th>&nbsp;</th>
		</tr>
	</ng-template>
	<ng-template pTemplate="body" let-ranking let-expanded="expanded">
		<tr class="ranking-row">
			<td>{{ranking.position}}</td>
			<td>{{ranking.user}}</td>
			<td>{{ranking.points}}</td>
			<td>{{ranking.location}}</td>
			<td>{{ranking.sent_in | date:"yyyy-MM-dd"}}</td>
			<td>
				<p-button
					class="btn-expand"
					type="button"
					icon="fa fa-eye"
					pRipple
					[rounded]="true"
					[outlined]="true"
					(onClick)="viewUser(ranking)"
				/>
			</td>
		</tr>
	</ng-template>
</p-table>

<div class="empty-msg" *ngIf="data.length == 0">
	<i class="fa fa-robot"></i>
	Ranking vazio...
</div>
