<div class="col-12">
	{{ data.length }} linhas
</div>

<p-table
	*ngIf="data.length > 0"
	[value]="data"
	selectionMode="multiple"
	dataKey="id"
	[tableStyle]="{'min-width': '50rem'}"
	sortMode="multiple"
>
	<ng-template pTemplate="header">
		<tr>
			<th pSortableColumn="name">
				Nome<p-sortIcon field="name" />
			</th>
			<th>E-mail</th>
			<th>Location</th>
			<th pSortableColumn="created_at">
				Data de Envio<p-sortIcon field="created_at" />
			</th>
			<th pSortableColumn="points">
				Pontos<p-sortIcon field="points" />
			</th>
			<th>&nbsp;</th>
		</tr>
	</ng-template>
	<ng-template pTemplate="body" let-user let-expanded="expanded">
		<tr class="user-row">
			<td>{{user.name}}</td>
			<td>{{user.email}}</td>
			<td>{{user.city}} ({{user.state}})</td>
			<td>{{user.created_at | date:"yyyy-MM-dd hh:mm"}}</td>
			<td>{{user.points}}</td>
			<td colspan="2" class="center">
				<p-button
					class="btn-expand"
					type="button"
					icon="fa fa-eye"
					pRipple
					[rounded]="true"
					[outlined]="true"
					(onClick)="viewUser(user)"
				/>
			</td>
		</tr>
	</ng-template>
</p-table>

<div class="empty-msg" *ngIf="data.length == 0">
	<i class="fa fa-robot"></i>
	Nenhuma lista encontrada...
</div>
