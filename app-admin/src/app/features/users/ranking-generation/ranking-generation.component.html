<app-window
	class="mb-2"
	title="Gerar Ranking"
	icon="fas fa-sort-amount-down-alt"
>
	<app-button
		caption="Gerar Ranking"
		type="primary"
		icon="fa fa-play-circle"
		[loading]="loading"
		(action)="generate()"
	/>

	<div class="flex mt-4" *ngIf="rs">
		<div class="flex">
			<span><b>Execution time:</b> {{rs.execution_time}}</span>
		</div>
		<div class="flex">
			<pre class="code" *ngIf="!loading && rs">{{ rs | json }}</pre>
		</div>
	</div>

</app-window>

<app-call-full-ranking />
