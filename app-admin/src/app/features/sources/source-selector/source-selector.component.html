<app-window title="Sources" icon="store"
	[loading]="loading"
	[showClose]="false" [collapsable]="false" >

	<div class="row">
		<app-select
			label="Source:"
			[required]="true"
			[options]="sources"
			[loading]="loading"
			[value]="selected"
			optionLabel="name"
			optionId="id"
			(valueChange)="sourceSelected($event)"
		/>
	</div>

</app-window>
